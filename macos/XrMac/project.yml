# XcodeGen: генерирует XrMac.xcodeproj из этого файла.
# Запуск: `xcodegen generate` в каталоге macos/XrMac.
# Потребности: Xcode (полный, не Command Line Tools) и xcodegen.
name: XrMac
options:
  bundleIdPrefix: dev.xr
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

packages:
  XrCore:
    path: ../XrCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Сборка Rust staticlib идёт скриптом scripts/build-macos.sh.
    OTHER_LDFLAGS:
      - "-lxr_ios_ffi"
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/../../target/release"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../xr-ios-ffi/include"

targets:
  XrMac:
    type: application
    platform: macOS
    sources:
      - path: XrMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xr.macos
        INFOPLIST_FILE: XrMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: XrMac/XrMac.entitlements
    dependencies:
      - package: XrCore
        product: XrCore
      - target: XrMacTunnel
        embed: true
    info:
      path: XrMac/Info.plist
      properties:
        CFBundleName: XR Proxy
        CFBundleDisplayName: XR Proxy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""

  XrMacTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: XrMacTunnel
    dependencies:
      - package: XrCore
        product: XrCoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xr.macos.tunnel
        INFOPLIST_FILE: XrMacTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: XrMacTunnel/XrMacTunnel.entitlements
    info:
      path: XrMacTunnel/Info.plist
      properties:
        CFBundleName: XR Tunnel
        CFBundleDisplayName: XR Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
