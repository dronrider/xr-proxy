[package]
name = "xr-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `relay-tls` даёт коннектор до агента (relay-стрим плюс pinned-TLS), `share`
# типы маршрута и мандата. Своего ключа подписи у фронта нет и не будет: он
# получает от хаба уже собранный маршрут.
xr-proto = { path = "../xr-proto", features = ["share", "relay-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
http-body-util = "0.1"
# Служебные ручки хаба по HTTPS. rustls на ring, как и весь остальной крипто-код
# дерева: второй провайдер в одном процессе поссорился бы с пиннингом агента.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Собственный TLS (блок [tls]): установка без фронта. Тот же ring-провайдер,
# что у пиннинга агента, поэтому дефолтный провайдер процесса не нужен вовсе.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
ed25519-dalek = "2"
