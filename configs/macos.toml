# Конфиг сервиса macOS (xr-macos, XR-309).
#
# Держит только обвязку Mac: серверы, ключ обфускации и правила маршрутизации
# берёт JSON-профиль приложения (profile_path), тот же, что уезжает в Android
# по QR или с хаба. Файл ставится командой `xr-macos install --profile ...` в
# /etc/xr-proxy/macos.toml, редактирование живой копии подхватывается после
# перезапуска сервиса (`sudo xr-macos stop && sudo xr-macos start`).
#
# Всё, что не задано явно, берётся из значений по умолчанию: они сведены с
# конвенцией приложения (адрес Mac и DNS внутри туннеля соседние, MTU 1280).
# Значения ниже повторяют дефолты и приведены как образец записи.

# Путь к JSON-профилю приложения.
profile_path = "/etc/xr-proxy/profile.json"

[net]
# Как часто сторож сверяет сеть: маршруты, правила PF, живость движка.
check_interval_secs = 5

[dnstun]
# Переводить системный DNS в туннель через networksetup. Без Network
# Extension это единственный способ убрать провайдерский резолвер из пути
# запросов; исходные значения сохраняются и возвращаются при остановке.
apply = true
# Адрес DNS внутри туннеля, его обслуживает FakeDns ядра. Должен отличаться
# от tun.address_v4: пара адресов, как у приложения.
# dns_server = "192.0.2.53"

[killswitch]
# Разрешить прямые DNS-запросы к резолверам сети. Включать только для
# профилей с доменами в правиле direct: их имена уйдут провайдеру в открытом
# виде. По умолчанию срезается, как и на роутере.
allow_direct_dns = false

[tun]
# Адрес Mac на utun. Соседний адрес пары занимает dnstun.dns_server.
# address_v4 = "198.51.100.2"
# ULA-адрес IPv6, как у NE-приложения.
# address_v6 = "fd00::2"
# MTU туннеля, ниже 1280 опускать нельзя (минимум IPv6).
# mtu = 1280
