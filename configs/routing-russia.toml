# ===============================================================
# XR Proxy: правила маршрутизации для России
# Актуально на август 2026
# ===============================================================
#
# Всё что не перечислено ниже, идёт напрямую без прокси.
# Добавляйте/убирайте домены по необходимости.
#
# `name` у правила это название тематической группы. Хаб раздаёт его
# клиентам вместе с доменами, и приложение показывает в просмотре пресета
# и в TOML-превью именно его, а не «доменов: 24». Поле опциональное:
# правило без имени работает как раньше.

[routing]
default_action = "direct"

# --- YouTube (замедлён, фактически не работает) ---
[[routing.rules]]
name = "YouTube"
action = "proxy"
domains = [
  "youtube.com", "*.youtube.com",
  "youtu.be",
  "*.googlevideo.com",
  "*.ytimg.com",
  "youtube-nocookie.com", "*.youtube-nocookie.com",
  "*.youtube-ui.l.google.com",
  "*.ggpht.com",
]

# --- Соцсети ---
# Meta признана экстремистской и заблокирована целиком, вместе с
# WhatsApp; Twitter/X, LinkedIn и Snapchat заблокированы отдельно.
[[routing.rules]]
name = "Соцсети"
action = "proxy"
domains = [
  # Meta: Facebook, Instagram, Threads, WhatsApp
  "facebook.com", "*.facebook.com",
  "fbcdn.net", "*.fbcdn.net",
  "*.fbsbx.com",
  "instagram.com", "*.instagram.com",
  "*.cdninstagram.com",
  "threads.net", "*.threads.net",
  "whatsapp.com", "*.whatsapp.com",
  "whatsapp.net", "*.whatsapp.net",
  "wa.me", "*.wa.me",
  "messenger.com", "*.messenger.com",
  "meta.com", "*.meta.com",
  # Twitter / X
  "twitter.com", "*.twitter.com",
  "x.com", "*.x.com",
  "t.co",
  "twimg.com", "*.twimg.com",
  "tweetdeck.com", "*.tweetdeck.com",
  # LinkedIn (заблокирован с 2016)
  "linkedin.com", "*.linkedin.com",
  "licdn.com", "*.licdn.com",
  # Snapchat (заблокирован с декабря 2025)
  "snapchat.com", "*.snapchat.com",
  "snap.com", "*.snap.com",
  "snapkit.co", "*.snapkit.co",
  "*.sc-cdn.net",
]

# --- Мессенджеры ---
# У Telegram заблокированы звонки и ограничены каналы. Подключается он
# часто напрямую по IP без SNI, поэтому помимо доменов нужны диапазоны
# его серверов.
[[routing.rules]]
name = "Мессенджеры"
action = "proxy"
domains = [
  # Telegram
  "telegram.org", "*.telegram.org",
  "t.me", "*.t.me",
  "telegram.me", "*.telegram.me",
  "telesco.pe",
  "tdesktop.com", "*.tdesktop.com",
  "*.tg.dev",
  # Discord
  "discord.com", "*.discord.com",
  "discord.gg",
  "discord.media", "*.discord.media",
  "discordapp.com", "*.discordapp.com",
  "discordapp.net", "*.discordapp.net",
  # Signal
  "signal.org", "*.signal.org",
  "whispersystems.org", "*.whispersystems.org",
]
ip_ranges = [
  # Telegram
  "91.108.56.0/22",
  "91.108.4.0/22",
  "91.108.8.0/22",
  "91.108.16.0/22",
  "91.108.12.0/22",
  "91.108.20.0/22",
  "149.154.160.0/20",
  "91.105.192.0/23",
  "185.76.151.0/24",
  "2001:b28:f23d::/48",
  "2001:b28:f23f::/48",
  "2001:67c:4e8::/48",
  "2001:b28:f23c::/48",
  "2a0a:f280::/32",
]

# --- Google (основные сервисы, бывают частично недоступны) ---
