]

# --- Медиа и стриминг ---
[[routing.rules]]
name = "Медиа и стриминг"
action = "proxy"
domains = [
  # Twitch
  "twitch.tv", "*.twitch.tv",
  "twitchcdn.net", "*.twitchcdn.net",
  "jtvnw.net", "*.jtvnw.net",
  # Spotify
  "spotify.com", "*.spotify.com",
  "scdn.co", "*.scdn.co",
  "spotifycdn.com", "*.spotifycdn.com",
  # SoundCloud
  "soundcloud.com", "*.soundcloud.com",
  "sndcdn.com", "*.sndcdn.com",
  # Medium
  "medium.com", "*.medium.com",
