]

# --- AI-сервисы ---
# Часть из них РКН не блокирует, наоборот: они сами отказывают
# российским IP («app unavailable»), и прокси тут нужен ради
# «нероссийского» выходного адреса.
[[routing.rules]]
name = "AI-сервисы"
action = "proxy"
domains = [
  "openai.com", "*.openai.com",
  "chatgpt.com", "*.chatgpt.com",
  "claude.ai", "*.claude.ai",
  "claude.com", "*.claude.com",
  "claudeusercontent.com", "*.claudeusercontent.com",
  "claude.site", "*.claude.site",
  "anthropic.com", "*.anthropic.com",
  "perplexity.ai", "*.perplexity.ai",
  "gemini.google.com",
  "bard.google.com",
]
# Anthropic edge (туда резолвятся claude.ai и claude.com) ловит и
# соединения без читаемого SNI.
ip_ranges = ["160.79.104.0/21"]

