# ===============================================================
# XR Proxy: правила маршрутизации для России
# Актуально на август 2026
# ===============================================================
#
# Всё что не перечислено ниже, идёт напрямую без прокси.
# Добавляйте/убирайте домены по необходимости.
#
# `name` у правила это название тематической группы. Хаб раздаёт его
# клиентам вместе с доменами, и приложение показывает в просмотре пресета
# и в TOML-превью именно его, а не «доменов: 24». Поле опциональное:
# правило без имени работает как раньше.
#
# Файл держится в соответствии с боевым пресетом `russia` на хабе
# (сверен на версии 37): те же группы, те же имена, тот же состав.
# Запись `*.example.com` покрывает и поддомены, и сам `example.com`,
# поэтому голая форма рядом со звёздочной не нужна.

[routing]
default_action = "direct"

# --- YouTube и личные сервисы ---
# YouTube замедлён и фактически не работает; рядом живут личные
# сервисы владельца пресета, которым тоже нужен обход.
[[routing.rules]]
name = "YouTube и личные сервисы"
action = "proxy"
domains = [
  "*.coderabbit.ai", "*.zoobr.top", "*.claudelog.com",
  "*.grizzlysms.com", "*.smtp2go.com", "*.forklog.com",
  "*.kimi.com", "*.xmpp.org", "*.youtube.ru",
  "*.youtube.com", "*.youtu.be", "*.googlevideo.com",
  "*.ytimg.com", "*.youtube-nocookie.com", "*.youtube-ui.l.google.com",
  "*.ggpht.com",
]

# --- Meta и WhatsApp ---
# Meta признана экстремистской и заблокирована целиком, вместе с WhatsApp.
[[routing.rules]]
name = "Meta и WhatsApp"
action = "proxy"
domains = [
  "*.facebook.com", "*.fbcdn.net", "*.fbsbx.com",
  "*.instagram.com", "*.cdninstagram.com", "*.threads.net",
  "*.whatsapp.com", "*.whatsapp.net", "*.wa.me",
  "*.messenger.com", "*.meta.com",
]

# --- Twitter и X ---
# Заблокирован с марта 2022.
[[routing.rules]]
name = "Twitter и X"
action = "proxy"
domains = [
  "*.twitter.com", "*.x.com", "t.co",
  "*.twimg.com", "*.tweetdeck.com",
]

# --- Telegram ---
# Домены и подсети дата-центров: часть клиентов ходит мимо DNS,
# по одним адресам.
[[routing.rules]]
name = "Telegram"
action = "proxy"
domains = [
  "*.telegram.org", "*.t.me", "*.telegram.me",
  "telesco.pe", "*.tdesktop.com", "*.tg.dev",
]
ip_ranges = [
  "91.108.56.0/22", "91.108.4.0/22", "91.108.8.0/22",
  "91.108.16.0/22", "91.108.12.0/22", "91.108.20.0/22",
  "149.154.160.0/20", "91.105.192.0/23", "185.76.151.0/24",
  "2001:b28:f23d::/48", "2001:b28:f23f::/48", "2001:67c:4e8::/48",
  "2001:b28:f23c::/48", "2a0a:f280::/32",
]

