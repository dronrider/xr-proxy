# xr-web: браузерный вход к публикациям агентов (LLD-38 фаза 2).
# Файл кладётся на VPS в /etc/xr-web/config.toml рядом с хабом.
#
# Внимание: на этом сервисе браузерный трафик живёт плейнтекстом. Это цена
# входа без своего клиента, и она названа прямо на странице входа.

[web]
# Локальный порт: наружу сервис выводит тот же фронт (nginx или Cloudflare),
# что выводит хаб, разводя их по Host. Слушать мир самому ему незачем.
bind = "127.0.0.1:8090"

# Домен публикаций: публикация `dash` открывается на https://dash.<domain>.
# Требует DNS-записи *.<domain> и wildcard-сертификата на фронте
# (docs/HUB-DEPLOY.md, раздел 3). То же значение стоит в [web] конфига хаба.
domain = "web.example.com"

# База хаба. С хабом на этой же машине это его локальный адрес: TLS и фронт
# на этом пути ни к чему.
hub_url = "http://127.0.0.1:8080"

# Общий секрет служебных ручек хаба: тот же, что в [web] конфига хаба.
# Прав админки он не даёт, ключа подписи за ним нет.
#   openssl rand -base64 32
shared_secret = "SAME_AS_HUB_WEB_SHARED_SECRET"

# Сколько живёт сессия браузера без активности (по умолчанию неделя).
# Активность продлевает, рестарт сервиса разлогинивает всех.
session_ttl_secs = 604800

log_level = "info"

# Своя терминация TLS: вариант установки без фронта. С фронтом блок не нужен,
# сертификатами xr-web не занимается.
# [tls]
# cert = "/etc/xr-web/tls/fullchain.pem"
# key = "/etc/xr-web/tls/privkey.pem"
