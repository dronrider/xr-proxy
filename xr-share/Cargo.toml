[package]
name = "xr-share"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Direct HTTPS serving via axum-server/rustls. Optional because it pulls the
# aws-lc C crypto backend, which doesn't cross-compile to Windows. The default
# build is HTTP-only (ring-only deps) and cross-compiles everywhere; ureq (for
# `init`) already uses ring. Enable on Linux when you want the agent to
# terminate TLS itself instead of running behind a terminator.
tls = ["dep:axum-server"]
# Реверс-туннель к relay для шар за NAT (LLD-23): исходящий mux к relay,
# регистрация, обслуживание реверс-стримов тем же роутером поверх identity-TLS
# (self-signed из ed25519 identity-ключа через rcgen на ring). Опционально:
# rcgen/tokio-rustls утяжеляют кросс-сборку под Windows/musl (XR-105), по
# умолчанию агент собирается без них. Крипто-бэкенд ring, как и у остального
# кросс-кода.
relay = [
    "dep:rcgen",
    "dep:tokio-rustls",
    "xr-proto/relay-tls",
    "ed25519-dalek/pkcs8",
]

[dependencies]
xr-proto = { path = "../xr-proto", features = ["share"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "fs", "process", "sync"] }
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
# Stream a PUT request body frame by frame (LLD-28 upload path) without buffering
# a multi-GB file in memory. Pure Rust, already in the tree via axum/hyper, so it
# does not weigh down the Windows/musl cross-build.
http-body = "1"
http-body-util = "0.1"
# Прокси публикации на локальный апстрим (LLD-38): клиент hyper на одно
# соединение, тело идёт потоком в обе стороны. Не за фичей `relay`: hyper и так
# в графе через axum, а харнесс `expose open` и разбор мандата нужны и в
# обычной сборке агента.
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
walkdir = "2"
mime_guess = "2"
# Git-контур шары (LLD-33): события рабочей папки для авто-коммита с дебаунсом.
# Чистая обвязка над inotify/FSEvents/kqueue, без транзитивных C-зависимостей.
notify = "8"
# Мосты тела запроса/ответа в AsyncRead/AsyncWrite для спавна upload-pack и
# receive-pack: запрос стримится в stdin процесса, stdout уезжает в ответ без
# буферизации целиком.
# Штатный git-клиент жмёт тела запросов Content-Encoding: gzip, транспорт
# обязан принимать обоих (LLD-33 п. 2.3).
async-compression = { version = "0.4", default-features = false, features = ["gzip", "tokio"] }
# Lightweight blocking HTTP client — only for `init` to fetch the hub's public
# key once. Keeps the agent off the heavy reqwest stack.
ureq = { version = "2", features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Реверс-туннель к relay (feature `relay`, default off): identity-TLS сервер над
# реверс-стримами mux. ring-бэкенд, чтобы кросс-сборка не тянула aws-lc.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }

# Убить группу процессов плагина импорта (LLD-29): yt-dlp порождает ffmpeg, и
# child.kill() оставил бы его сиротой качать дальше. Только unix, на Windows
# группы нет и убивается сам child. Секция target-зависимостей стоит строго
# после обычных [dependencies]: всё, что ниже её заголовка, уехало бы в
# unix-only и пропало из windows-сборки.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# Сжать тело запроса upload-pack руками для теста gunzip-ветки транспорта:
# маленький клон git не жмёт, а путь обязан работать (LLD-33 п. 2.3).
flate2 = "1"
# Full relay data-path e2e (relay.rs tests, only built with `--features relay`):
# a real relay, the agent uplink, and a pinned-TLS consumer over the loopback
# forwarder. reqwest is the Android consumer's transport (xr-core).
xr-relay = { path = "../xr-relay" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
