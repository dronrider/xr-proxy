# Маскировка токенов в access_log фронта (XR-198).
#
# Инвайт-токен хаба стоит в пути ссылки (/invite/<токен>), share-токен едет в
# query (?token=<блоб>). Обе ссылки открывает браузер, и заголовок им не
# дать. Дефолтный формат combined пишет $request и $http_referer целиком, то
# есть кладёт секреты в лог. Файл подключается в контексте http (каталог
# /etc/nginx/conf.d/), а в server-блоках хаба и xr-web пишется строка
#
#     access_log /var/log/nginx/access.log xr_masked;
#
# Правила те же, что у собственного лога хаба (xr-hub/src/api/log_mask.rs).
# Сегмент после invite/invites и значение token= заменяются на <masked>. Из
# нескольких регулярок срабатывает первая совпавшая. Поэтому у URL с обоими
# секретами разом маскировать пришлось бы в два прохода; таких ссылок хаб и
# агент не выдают. error_log переменных не знает и при 502 пишет строку
# запроса как есть, это остаточный риск (docs/HUB-DEPLOY.md, раздел 3).
# Захваты записаны в форме (?P<имя>...), её понимают и PCRE nginx, и тест
# xr-hub/tests/nginx_token_mask.rs, который гоняет эти регулярки по образцам.

map $request_uri $xr_masked_uri {
    "~^(?P<pre>.*/invites?/)[^/?]+(?P<post>.*)$"  "${pre}<masked>${post}";
    "~^(?P<pre>.*[?&]token=)[^&]*(?P<post>.*)$"    "${pre}<masked>${post}";
    default                                        $request_uri;
}

map $http_referer $xr_masked_referer {
    "~^(?P<pre>.*/invites?/)[^/?]+(?P<post>.*)$"  "${pre}<masked>${post}";
    "~^(?P<pre>.*[?&]token=)[^&]*(?P<post>.*)$"    "${pre}<masked>${post}";
    default                                        $http_referer;
}

log_format xr_masked '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $xr_masked_uri $server_protocol" '
                     '$status $body_bytes_sent '
                     '"$xr_masked_referer" "$http_user_agent"';
